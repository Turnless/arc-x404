[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# ReviewDemo reads the checker's permit files.
fs_permissions = [{ access = "read", path = "./permits" }]

[rpc_endpoints]
arc = "https://rpc.mainnet.arc.io"
